<!DOCTYPE html>
<!--
  ============================================
  ARG Demo 最终版 v1.1
  · 序章：顾铭的最后一段语音
  · 平台：iOS/安卓/桌面，file:// 直接运行
  · 更新：2026-08-27
  ============================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>语音留言</title>
<style>
  * {
    margin:0; padding:0; box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    background: #0d0d12;
    color: #e8e8ea;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .phone {
    width: 100%;
    max-width: 430px;
    padding: 40px 28px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .status {
    text-align: center;
    font-size: 13px;
    color: #666;
    letter-spacing: 1px;
  }
  .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #22252e;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin: 0 auto;
  }
  .from-label {
    text-align: center;
    font-size: 15px;
    color: #999;
  }
  .from-name {
    text-align: center;
    font-size: 22px;
    font-weight: 600;
  }
  .voice-card {
    background: #1c1e26;
    border-radius: 18px;
    padding: 26px 22px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid #2a2d38;
  }
  .voice-card:hover { background: #22252e; }
  .voice-card.playing {
    border-color: #4a7dff;
    box-shadow: 0 0 24px rgba(74,125,255,0.15);
  }
  .voice-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #888;
  }
  .voice-meta .red-dot {
    width: 8px; height: 8px;
    background: #ff4444;
    border-radius: 50%;
  }
  .play-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 18px;
  }
  .play-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #4a7dff;
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    min-height: 48px;
  }
  .play-btn:active { transform: scale(0.95); }
  .waveform {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 3px;
    height: 40px;
    overflow: hidden;
  }
  .wave-bar {
    width: 3px;
    background: #4a4f60;
    border-radius: 2px;
  }
  .wave-bar.active { background: #4a7dff; }
  .voice-time {
    font-size: 12px;
    color: #666;
    margin-top: 10px;
  }
  .transcript {
    margin-top: 22px;
    font-size: 15px;
    line-height: 2.1;
    color: #b8bac2;
    display: none;
    border-top: 1px solid #2a2d38;
    padding-top: 18px;
  }
  .transcript .warning {
    color: #e0b45c;
  }
  .next-hint {
    display: none;
    text-align: center;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  .next-btn {
    display: none;
    background: #e04a3a;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    letter-spacing: 2px;
    min-height: 52px;
  }
  .next-btn:active { transform: scale(0.98); }
  .progress-num {
    position: fixed;
    bottom: 18px; right: 18px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #22252e;
    color: #888;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status">8月19日 23:47 · 未接来电(7) · 语音留言(1)</div>

  <div class="avatar">👤</div>
  <div class="from-label">来自</div>
  <div class="from-name">顾铭</div>

  <div class="voice-card" id="voiceCard" onclick="togglePlay()">
    <div class="voice-meta">
      <span class="red-dot"></span>
      <span>未读语音留言</span>
    </div>
    <div class="play-row">
      <button class="play-btn" id="playBtn" onclick="event.stopPropagation();togglePlay()">▶</button>
      <div class="waveform" id="waveform"></div>
    </div>
    <div class="voice-time" id="voiceTime">0:00 / 0:31</div>
  </div>

  <div class="transcript" id="transcript">
    「姐，是我。你听到这条语音的时候，我应该已经在山上了。<br>
    七月十四那天的事，电话里说不清。<br>
    <span class="warning">如果我没回来，别报警，也别上山。</span><br>
    去中原市福安区平安路三十七号，<b>福安家常菜馆</b>。<br>
    我在那里给你留了东西。<br>
    还有，别信门口贴的那张符。<br>
    记住，山上的东西，不是给人看的。」
  </div>

  <div class="next-hint" id="nextHint">▼ 线索藏在录音里 ▼</div>
  <button class="next-btn" id="nextBtn" onclick="location.href='restaurant.html'">
    前往「福安家常菜馆」→
  </button>
</div>
<div class="progress-num">0</div>

<script>
var audio = new Audio('recording.mp3');
var playing = false;
var totalBars = 36;

// 生成波形条（静态假波形）
function buildWaveform() {
  var wf = document.getElementById('waveform');
  for (var i = 0; i < totalBars; i++) {
    var bar = document.createElement('div');
    bar.className = 'wave-bar';
    bar.id = 'bar' + i;
    var h = 8 + Math.abs(Math.sin(i * 0.7)) * 28;
    bar.style.height = h + 'px';
    wf.appendChild(bar);
  }
}
buildWaveform();

function togglePlay() {
  var card = document.getElementById('voiceCard');
  var btn = document.getElementById('playBtn');
  if (playing) {
    audio.pause();
    playing = false;
    btn.textContent = '▶';
    card.classList.remove('playing');
    return;
  }
  audio.play();
  playing = true;
  btn.textContent = '⏸';
  card.classList.add('playing');
  document.getElementById('transcript').style.display = 'block';
}

audio.addEventListener('timeupdate', function() {
  var t = audio.currentTime;
  var d = audio.duration || 26.7;
  document.getElementById('voiceTime').textContent =
    Math.floor(t/60) + ':' + ('0' + Math.floor(t%60)).slice(-2) +
    ' / 0:31';
  // 波形进度
  var activeBars = Math.floor(t / d * totalBars);
  for (var i = 0; i < totalBars; i++) {
    var b = document.getElementById('bar' + i);
    if (b) b.className = 'wave-bar' + (i < activeBars ? ' active' : '');
  }
  // 播完显示下一步
  if (t >= d - 0.3) {
    document.getElementById('nextHint').style.display = 'block';
    document.getElementById('nextBtn').style.display = 'block';
  }
});

audio.addEventListener('ended', function() {
  playing = false;
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('voiceCard').classList.remove('playing');
});
</script>
</body>
</html>
